# Required Linux Tauri bundle for S2-Linux live testing.
# Builds AppImage + .deb with the REAL codebase-memory-mcp sidecar only.
# Failures block the workflow (no continue-on-error / silent UI-only fallback).
# Bundles are selected via CLI (`--bundles deb,appimage`), not tauri.conf targets.
# Emergency stub packaging is opt-in via workflow_dispatch only.

name: Linux bundle

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_stub_sidecar:
        description: "Emergency UI-only stub packaging (never for PR CI)"
        type: boolean
        default: false

concurrency:
  group: linux-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # AppImage tooling on headless runners without FUSE mounts.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"
  CBM_RELEASE: "v0.11.0"
  # Portable = statically linked; runs on ubuntu-22.04 (dyn build needs GLIBCXX_3.4.32).
  CBM_ASSET: "codebase-memory-mcp-linux-amd64-portable.tar.gz"
  # Pin release asset integrity (DeusData codebase-memory-mcp v0.11.0 linux-amd64-portable).
  CBM_SHA256: "1f9e8293eb2bc5c05cfa27a7e8fc033da6d729ffad525ccfcdaa3fd606306683"

jobs:
  linux-bundle:
    name: Build AppImage + deb
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        timeout-minutes: 26
        run: bash scripts/ci/install-linux-build-deps.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve sidecar mode
        id: mode
        run: |
          set -euo pipefail
          ALLOW_STUB="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ALLOW_STUB="${{ inputs.allow_stub_sidecar }}"
          fi
          if [[ "$ALLOW_STUB" == "true" ]]; then
            echo "mode=stub" >> "$GITHUB_OUTPUT"
            echo "artifact_name=agent-lounge-linux-ui-only" >> "$GITHUB_OUTPUT"
            echo "WARN: workflow_dispatch allow_stub_sidecar=true — UI-only stub packaging"
          else
            echo "mode=real" >> "$GITHUB_OUTPUT"
            echo "artifact_name=agent-lounge-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch real codebase-memory-mcp (linux-amd64)
        id: sidecar
        if: steps.mode.outputs.mode == 'real'
        run: |
          set -euo pipefail
          EXPECTED="${CBM_RELEASE#v}"
          URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/${CBM_RELEASE}/${CBM_ASSET}"
          mkdir -p bridge
          TMP="$(mktemp -d)"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o "$TMP/mcp.tar.gz"
          echo "${CBM_SHA256}  $TMP/mcp.tar.gz" | sha256sum -c -
          tar -xzf "$TMP/mcp.tar.gz" -C "$TMP"
          BIN="$(find "$TMP" -type f -name 'codebase-memory-mcp' | head -n1)"
          if [[ -z "$BIN" || ! -f "$BIN" ]]; then
            echo "FAIL: binary not found in archive"
            exit 1
          fi
          install -m 755 "$BIN" bridge/codebase-memory-mcp
          RAW_VER="$(bridge/codebase-memory-mcp --version 2>&1 | head -n1)"
          VERSION="$(printf '%s' "$RAW_VER" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "FAIL: could not parse --version from: ${RAW_VER}"
            exit 1
          fi
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "FAIL: sidecar version mismatch: got=${VERSION} expected=${EXPECTED} (raw=${RAW_VER})"
            exit 1
          fi
          SIZE_B="$(wc -c < bridge/codebase-memory-mcp | tr -d '[:space:]')"
          if [[ "$SIZE_B" -lt 4096 ]]; then
            echo "FAIL: staged binary looks like a stub ($SIZE_B bytes)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${SIZE_B}" >> "$GITHUB_OUTPUT"
          echo "sidecar ok: $VERSION ($SIZE_B bytes)"

      - name: Stage externalBin
        id: stage
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          if [[ "$MODE" == "real" ]]; then
            bash src-tauri/scripts/prepare-sidecar.sh
            echo "mode=real" >> "$GITHUB_OUTPUT"
            echo "artifact_name=agent-lounge-linux" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.sidecar.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "size_bytes=${{ steps.sidecar.outputs.size_bytes }}" >> "$GITHUB_OUTPUT"
          else
            bash src-tauri/scripts/prepare-sidecar.sh --stub
            echo "mode=stub" >> "$GITHUB_OUTPUT"
            echo "artifact_name=agent-lounge-linux-ui-only" >> "$GITHUB_OUTPUT"
            echo "version=stub" >> "$GITHUB_OUTPUT"
            echo "size_bytes=$(wc -c < src-tauri/binaries/codebase-memory-mcp-x86_64-unknown-linux-gnu | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri Linux bundles (deb + AppImage)
        run: |
          set -euo pipefail
          if [[ "${{ steps.stage.outputs.mode }}" == "real" ]]; then
            # beforeBundleCommand re-runs prepare-sidecar; bridge/ binary must be present (no stub).
            npm run tauri -- build --bundles deb,appimage
          else
            LOUNGE_SIDECAR_ALLOW_STUB=1 npm run tauri -- build --bundles deb,appimage
          fi
        env:
          CI: "true"

      - name: Verify sidecar inside .deb
        run: |
          set -euo pipefail
          EXPECTED="${CBM_RELEASE#v}"
          DEB="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)"
          echo "Inspecting $DEB"
          dpkg -c "$DEB" | tee /tmp/deb-contents.txt | grep -E 'codebase-memory-mcp' || {
            echo "FAIL: codebase-memory-mcp not listed in .deb"
            exit 1
          }
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          SIDECAR="$(find "$EXTRACT" -type f -name 'codebase-memory-mcp' | head -n1)"
          if [[ -z "$SIDECAR" ]]; then
            echo "FAIL: codebase-memory-mcp not extracted from .deb"
            exit 1
          fi
          SIZE_B="$(wc -c < "$SIDECAR" | tr -d '[:space:]')"
          echo "bundled sidecar size=$SIZE_B path=$SIDECAR"
          if [[ "${{ steps.stage.outputs.mode }}" == "real" ]]; then
            if [[ "$SIZE_B" -lt 4096 ]]; then
              echo "FAIL: bundled sidecar is stub-sized"
              exit 1
            fi
            RAW_VER="$("$SIDECAR" --version 2>&1 | head -n1)"
            VERSION="$(printf '%s' "$RAW_VER" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' | head -n1)"
            if [[ -z "$VERSION" ]]; then
              echo "FAIL: could not parse bundled --version from: ${RAW_VER}"
              exit 1
            fi
            if [[ "$VERSION" != "$EXPECTED" ]]; then
              echo "FAIL: bundled sidecar version mismatch: got=${VERSION} expected=${EXPECTED} (raw=${RAW_VER})"
              exit 1
            fi
            echo "bundled --version: $VERSION (raw=${RAW_VER})"
            {
              echo "SIDECAR_VERSION=${VERSION}"
              echo "SIDECAR_SIZE_BYTES=${SIZE_B}"
              echo "SIDECAR_PATH=${SIDECAR}"
            } >> "$GITHUB_ENV"
          else
            {
              echo "SIDECAR_VERSION=stub"
              echo "SIDECAR_SIZE_BYTES=${SIZE_B}"
              echo "SIDECAR_PATH=${SIDECAR}"
            } >> "$GITHUB_ENV"
          fi

      - name: Assert lounge-test-helper absent from .deb
        run: |
          set -euo pipefail
          # test-helpers bin must never ship; tauri build omits required-features bins.
          if [[ ! -f /tmp/deb-contents.txt ]]; then
            DEB="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)"
            dpkg -c "$DEB" > /tmp/deb-contents.txt
          fi
          if grep -E 'lounge-test-helper' /tmp/deb-contents.txt; then
            echo "FAIL: lounge-test-helper must not be packaged in the .deb"
            exit 1
          fi
          echo "ok: lounge-test-helper absent from .deb listing"

      - name: Sidecar functional smoke
        if: steps.stage.outputs.mode == 'real'
        run: |
          set -euo pipefail
          EXPECTED="${CBM_RELEASE#v}"
          SIDECAR="${SIDECAR_PATH:-}"
          if [[ -z "$SIDECAR" || ! -x "$SIDECAR" ]]; then
            echo "FAIL: bundled sidecar path missing or not executable: ${SIDECAR:-<empty>}"
            exit 1
          fi
          RAW_VER="$("$SIDECAR" --version 2>&1 | head -n1)"
          VERSION="$(printf '%s' "$RAW_VER" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' | head -n1)"
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "FAIL: smoke --version mismatch: got=${VERSION} expected=${EXPECTED} (raw=${RAW_VER})"
            exit 1
          fi
          echo "smoke --version ok: $VERSION"

          FIXTURE="$(mktemp -d)"
          trap 'rm -rf "$FIXTURE"' EXIT
          cat >"$FIXTURE/hello.py" <<'PY'
          def hello(name: str) -> str:
              return f"hello {name}"


          def main() -> None:
              print(hello("lounge"))


          if __name__ == "__main__":
              main()
          PY
          # MemoryBridge uses `codebase-memory-mcp cli <tool> …` (not bare tool name;
          # bare argv enters MCP stdio and yields empty stdout with closed stdin).
          # v0.11.0 index_repository flags: --repo-path, --mode (no --format).
          set +e
          OUT="$("$SIDECAR" cli index_repository --repo-path "$FIXTURE" --mode fast 2>&1)"
          RC=$?
          set -e
          echo "index_repository exit=${RC}"
          echo "$OUT" | head -c 4000
          echo
          if [[ "$RC" -ne 0 ]]; then
            echo "FAIL: index_repository exited ${RC}"
            exit 1
          fi
          if [[ -z "$(printf '%s' "$OUT" | tr -d '[:space:]')" ]]; then
            echo "FAIL: index_repository produced empty stdout/stderr"
            exit 1
          fi
          if ! printf '%s' "$OUT" | grep -Eqi '"status"[[:space:]]*:[[:space:]]*"indexed"|\"nodes\"|\"edges\"'; then
            echo "FAIL: index_repository did not report indexed status/nodes/edges"
            exit 1
          fi
          echo "smoke index_repository ok"

      - name: Collect artifact files
        if: always()
        run: |
          set -euo pipefail
          DEST="${{ runner.temp }}/agent-lounge-linux"
          mkdir -p "$DEST"
          shopt -s nullglob
          copied=0
          for f in \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.zsync
          do
            cp -v "$f" "$DEST/"
            copied=1
          done
          if [[ "$copied" -eq 0 ]]; then
            if [[ -x src-tauri/target/release/agent-lounge-os ]]; then
              cp -v src-tauri/target/release/agent-lounge-os "$DEST/"
            fi
          fi
          cp scripts/qa/linux/RUNTIME_DEPS.md "$DEST/RUNTIME_DEPS.md"
          cp scripts/qa/linux/README.md "$DEST/README.md"
          MODE="${{ steps.stage.outputs.mode }}"
          VER="${SIDECAR_VERSION:-}"
          if [[ -z "$VER" ]]; then
            VER="${{ steps.sidecar.outputs.version }}"
          fi
          VER="$(printf '%s' "$VER" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' | head -n1)"
          if [[ -z "$VER" && "$MODE" == "stub" ]]; then
            VER="stub"
          elif [[ -z "$VER" ]]; then
            VER="${CBM_RELEASE#v}"
          fi
          SZ="${SIDECAR_SIZE_BYTES:-${{ steps.sidecar.outputs.size_bytes }}}"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_OS}"
            echo "sidecar_mode=${MODE:-unknown}"
            echo "sidecar_version=${VER:-unknown}"
            echo "sidecar_size_bytes=${SZ:-unknown}"
            echo "sidecar_triple=x86_64-unknown-linux-gnu"
            echo "sidecar_release=${CBM_RELEASE}"
            echo "sidecar_asset=${CBM_ASSET}"
          } > "$DEST/BUILD_INFO.txt"
          cat "$DEST/BUILD_INFO.txt"
          ls -lah "$DEST"

      - name: Upload Linux artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.artifact_name || 'agent-lounge-linux' }}
          path: ${{ runner.temp }}/agent-lounge-linux/
          if-no-files-found: warn
          retention-days: 14
