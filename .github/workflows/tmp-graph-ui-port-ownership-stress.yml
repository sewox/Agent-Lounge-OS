# TEMPORARY — prove graph_ui_port_ownership stability after exclusive-reserve fix.
# Runs the suite 20× on ubuntu/macOS/Windows with --test-threads=16.
# Covers: 3 ownership integration tests, exclusive reservation test, and the
# changed classify unit tests (held-free list). Remove after evidence.

name: TMP graph_ui_port_ownership stress

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tmp-port-own-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ownership-stress:
    name: Ownership 20x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: ownership + reservation + classify unit ×20 (--test-threads=16)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "=== ${{ matrix.os }} run $i/20 ==="
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers \
              --test graph_ui_port_ownership -- --test-threads=16
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers \
              --lib classify_auto_foreign_reports_next_port_without_conflict -- --test-threads=16
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers \
              --lib classify_user_conflict_keeps_preferred_port -- --test-threads=16
          done
          echo "OK ${{ matrix.os }} 20/20"
