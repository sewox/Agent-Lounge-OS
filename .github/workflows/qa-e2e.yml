# Playwright e2e + static QA companion (hydration regression + baseline).
# Hydration-safety static gate lives in ci.yml → static-gates (required).
# This workflow must stay green on PRs (no continue-on-error).

name: QA e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # mock-ban + small-font + hydration-safety are required via ci.yml → static-gates.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Apt OS-deps step budget is 26m; suite ~10–15m; browser cache hit is seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Key on the resolved playwright package version (not the whole lockfile) so
      # unrelated npm bumps do not bust the browser cache. Browsers live under
      # ~/.cache/ms-playwright; apt/OS deps are NOT covered by this cache.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      # OS deps always via hardened installer (never playwright install-deps / --with-deps).
      - name: Install Playwright OS deps
        timeout-minutes: 26
        run: bash scripts/ci/install-playwright-os-deps.sh chromium

      # Cache miss: download Chromium only (OS deps already installed above).
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Cache hit: browsers restored; backfill if the restored cache was incomplete.
      - name: Install Playwright browsers (cache hit backfill)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Build static UI
        run: npm run build

      - name: Run e2e suite
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright + layout artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-baseline-${{ github.sha }}
          path: |
            test-results/qa-baseline/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
