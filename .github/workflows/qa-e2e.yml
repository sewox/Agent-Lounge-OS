# Playwright e2e + static QA companion (hydration regression + baseline).
# Hydration-safety static gate lives in ci.yml → static-gates (required).
# This workflow must stay green on PRs (no continue-on-error).

name: QA e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # mock-ban + small-font + hydration-safety are required via ci.yml → static-gates.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static UI
        run: npm run build

      - name: Run e2e suite
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright + layout artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-baseline-${{ github.sha }}
          path: |
            test-results/qa-baseline/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
