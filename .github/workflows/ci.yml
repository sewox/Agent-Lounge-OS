name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run types:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  workers:
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r workers/requirements.txt

      - name: Pytest
        run: pytest workers/tests -q
        working-directory: ${{ github.workspace }}

  static-gates:
    name: QA static gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Mock-ban (strict)
        run: bash scripts/qa/gates/mock-ban.sh
        env:
          QA_MOCK_BAN_STRICT: "1"

      - name: Small-font grep
        run: bash scripts/qa/gates/small-font.sh

  ci:
    name: CI
    needs: [frontend, rust, workers, static-gates]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require green jobs
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.workers.result }}" = "success"
          test "${{ needs.static-gates.result }}" = "success"
