name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run types:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    # Apt step budget is 26m (hardened installer); leave headroom for cargo.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        timeout-minutes: 26
        run: bash scripts/ci/install-linux-build-deps.sh --preset tauri-gtk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      # Required by nats_manager::event_pump_receives_non_bus_message_on_wildcard
      # (fails loud if missing — see docs/qa/rust-opt-in-tests.md).
      # Pin + sha256: scripts/ci/install-nats-server.sh
      - name: Install nats-server
        run: bash scripts/ci/install-nats-server.sh

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features test-helpers -- -D warnings

      - name: Test
        timeout-minutes: 20
        # test-helpers builds lounge-test-helper (required-features) for ownership integration tests.
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers

      # Path dependency is not covered by `cargo test` without -p (no [workspace]).
      - name: Test lounge_protocol
        timeout-minutes: 5
        run: cargo test -p lounge_protocol --manifest-path src-tauri/Cargo.toml --locked

  workers:
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r workers/requirements.txt

      - name: Pytest
        run: pytest workers/tests -q
        working-directory: ${{ github.workspace }}

  static-gates:
    name: QA static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mock-ban (strict)
        run: bash scripts/qa/gates/mock-ban.sh

      - name: CI hiding ban (no silent workflow failure)
        run: bash scripts/qa/gates/ci-hiding-ban.sh

      - name: Small-font grep
        run: bash scripts/qa/gates/small-font.sh

      - name: Hydration safety gate
        run: bash scripts/qa/gates/hydration-safety.sh
        env:
          QA_HYDRATION_SAFETY_STRICT: "1"

      - name: Playwright skip/fixme/fail ban
        run: bash scripts/qa/gates/playwright-skip-ban.sh

      - name: Playwright config coverage (no silent grep/testIgnore)
        run: bash scripts/qa/gates/playwright-config-coverage.sh

  # Independent MCP client-matrix probe (tools/mcp-probe). No product code.
  # Cross-platform; required gate — no continue-on-error / skip labels.
  mcp-probe:
    name: MCP probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit + integration tests
        working-directory: tools/mcp-probe
        shell: bash
        run: npm test

      - name: Short run-matrix smoke
        working-directory: tools/mcp-probe
        shell: bash
        run: MCP_PROBE_DELAYS=0.05,0.1 npm run run-matrix

  ci:
    name: CI
    needs: [frontend, rust, workers, static-gates, mcp-probe]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require green jobs
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.workers.result }}" = "success"
          test "${{ needs.static-gates.result }}" = "success"
          test "${{ needs.mcp-probe.result }}" = "success"
