# Non-blocking cross-platform cargo + build (PR-0 / §10.2).
# Linux remains the main Playwright runner (qa-e2e.yml).
# This workflow keeps the primary CI gate green while we prove
# windows-latest and macos-latest compile/test paths.

name: QA cross-platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-xplat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-matrix:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub (Unix)
        if: runner.os != 'Windows'
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Stage externalBin stub (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      # Required by nats_manager::event_pump_receives_non_bus_message_on_wildcard
      # (fails loud if missing — see docs/qa/rust-opt-in-tests.md).
      - name: Install nats-server (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NATS_VERSION=v2.10.24
          case "$(uname -m)" in
            arm64|aarch64) NATS_ARCH=arm64 ;;
            *) NATS_ARCH=amd64 ;;
          esac
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-darwin-${NATS_ARCH}.tar.gz" \
            | tar -xz
          sudo install -m 0755 "nats-server-${NATS_VERSION}-darwin-${NATS_ARCH}/nats-server" /usr/local/bin/nats-server
          nats-server -v

      - name: Install nats-server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NATS_VERSION=v2.10.24
          curl -fsSL -o nats.zip "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-windows-amd64.zip"
          unzip -o nats.zip
          mkdir -p "$HOME/bin"
          cp "nats-server-${NATS_VERSION}-windows-amd64/nats-server.exe" "$HOME/bin/nats-server.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/nats-server.exe" -v

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend-matrix:
    name: Frontend build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
