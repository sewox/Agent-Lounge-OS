# Cross-platform cargo + frontend build/unit (PR-0 / §10.2).
# Linux remains the main Playwright runner (qa-e2e.yml).
# These jobs are required gates (no continue-on-error).

name: QA cross-platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-xplat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-matrix:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail fast on hangs (was 45m; cargo test alone should finish well under this).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub (Unix)
        if: runner.os != 'Windows'
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Stage externalBin stub (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      # Required by nats_manager::event_pump_receives_non_bus_message_on_wildcard
      # (fails loud if missing — see docs/qa/rust-opt-in-tests.md).
      # Pin + sha256: scripts/ci/install-nats-server.sh (Linux/mac/Windows).
      - name: Install nats-server
        shell: bash
        run: bash scripts/ci/install-nats-server.sh

      - name: Cargo test
        timeout-minutes: 20
        # test-helpers builds lounge-test-helper (required-features) for ownership integration tests.
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers

      # Path dependency is not covered by `cargo test` without -p (no [workspace]).
      - name: Cargo test lounge_protocol
        timeout-minutes: 5
        run: cargo test -p lounge_protocol --manifest-path src-tauri/Cargo.toml --locked

  # TEMPORARY (PR-Test-NATS-Env): prove auth/conf path race is gone — 20× loop.
  # Remove this job before final merge once macOS/Windows/Linux evidence is posted.
  nats-auth-race-stability:
    name: NATS auth race stability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: nats-race-stability

      - name: Stage externalBin stub
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Install nats-server
        shell: bash
        run: bash scripts/ci/install-nats-server.sh

      - name: Build test binary
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers --lib --no-run

      - name: NATS auth race suite ×20 (zero failures)
        shell: bash
        timeout-minutes: 30
        run: bash scripts/ci/nats-auth-race-stability.sh 20

  frontend-matrix:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json test:unit uses double-quoted glob (Windows cmd-safe) +
      # node-no-navigator preload (platform.test.ts intent on Node 21+ hosts).
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
