# Cross-platform cargo + frontend build/unit (PR-0 / §10.2).
# Linux remains the main Playwright runner (qa-e2e.yml).
# These jobs are required gates (no continue-on-error).

name: QA cross-platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-xplat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-matrix:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail fast on hangs (was 45m; cargo test alone should finish well under this).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub (Unix)
        if: runner.os != 'Windows'
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Stage externalBin stub (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      # Required by nats_manager::event_pump_receives_non_bus_message_on_wildcard
      # (fails loud if missing — see docs/qa/rust-opt-in-tests.md).
      # Pin + sha256: scripts/ci/install-nats-server.sh (Linux/mac/Windows).
      - name: Install nats-server
        shell: bash
        run: bash scripts/ci/install-nats-server.sh

      - name: Cargo test
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # Path dependency is not covered by `cargo test` without -p (no [workspace]).
      - name: Cargo test lounge_protocol
        timeout-minutes: 5
        run: cargo test -p lounge_protocol --manifest-path src-tauri/Cargo.toml --locked

  frontend-matrix:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same suite as `npm run test:unit`, plus navigator stub so
      # platform.test.ts "without navigator" asserts correctly on mac/win
      # (Node 21+ exposes host navigator; see scripts/ci/node-no-navigator.mjs).
      - name: Unit tests
        shell: bash
        run: |
          node --experimental-strip-types \
            --import ./scripts/node-alias-loader.mjs \
            --import ./scripts/ci/node-no-navigator.mjs \
            --test \
            src/lib/ui-prefs.test.ts \
            src/lib/lounge-events.test.ts \
            src/lib/lounge-health.test.ts \
            src/lib/i18n/locale.test.ts \
            src/lib/i18n/locale-parity.test.ts \
            src/lib/approval-alert/engine.test.ts \
            src/lib/platform.test.ts \
            src/hooks/hydration-hooks.test.ts \
            src/lib/vault-projects.test.ts \
            src/lib/hydration-console.test.ts \
            src/lib/remote-access.test.ts

      - name: Build
        run: npm run build
