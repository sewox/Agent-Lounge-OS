# Cross-platform cargo + frontend build/unit (PR-0 / §10.2).
# Linux remains the main Playwright runner (qa-e2e.yml).
# These jobs are required gates (no continue-on-error).

name: QA cross-platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-xplat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-matrix:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail fast on hangs (was 45m; cargo test alone should finish well under this).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Health-scan stub dispatcher (`write_fast_paged_stub`) shells out to Python.
      # Pin an interpreter so Windows runners do not hit the Store `python` alias
      # (hangs under CREATE_NO_WINDOW → false 15s codebase-memory-mcp timeouts).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Health-1a real_cbm_v011_skip_limit_multi_page needs the pinned v0.11.0 binary
      # on every OS (checksummed). The Rust test can also fetch itself; CI stages it
      # first so Windows/macOS do not depend on in-test download alone.
      - name: Fetch real codebase-memory-mcp v0.11.0
        shell: bash
        run: |
          chmod +x scripts/ci/fetch-codebase-memory-mcp.sh
          bash scripts/ci/fetch-codebase-memory-mcp.sh

      # Required by nats_manager::event_pump_receives_non_bus_message_on_wildcard
      # (fails loud if missing — see docs/qa/rust-opt-in-tests.md).
      # Pin + sha256: scripts/ci/install-nats-server.sh (Linux/mac/Windows).
      - name: Install nats-server
        shell: bash
        run: bash scripts/ci/install-nats-server.sh

      - name: Cargo test
        timeout-minutes: 20
        # test-helpers builds lounge-test-helper (required-features) for ownership integration tests.
        env:
          # Absolute path so the real-CBM test finds the CI-provisioned binary from any cwd.
          HEALTH_CBM_BIN: ${{ runner.os == 'Windows' && format('{0}/bridge/codebase-memory-mcp.exe', github.workspace) || format('{0}/bridge/codebase-memory-mcp', github.workspace) }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers

      # Path dependency is not covered by `cargo test` without -p (no [workspace]).
      - name: Cargo test lounge_protocol
        timeout-minutes: 5
        run: cargo test -p lounge_protocol --manifest-path src-tauri/Cargo.toml --locked

  frontend-matrix:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json test:unit uses double-quoted glob (Windows cmd-safe) +
      # node-no-navigator preload (platform.test.ts intent on Node 21+ hosts).
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
