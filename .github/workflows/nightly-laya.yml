# Nightly real-weights Laya inference (opt-in feature, not #[ignore]).
# Default PR CI covers the same Candle path via `laya_infer_tiny_fixture`.
name: Nightly Laya

on:
  schedule:
    # 03:15 UTC — after typical dependency mirrors settle.
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-laya-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LAYA_LIVE_INFER: "1"
  LOUNGE_LAYA_DIR: ${{ github.workspace }}/.laya-nightly

jobs:
  laya-live:
    name: Laya live infer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Cache Laya weights
        uses: actions/cache@v4
        with:
          path: ${{ env.LOUNGE_LAYA_DIR }}
          key: laya-weights-${{ hashFiles('src-tauri/src/services/model_manager.rs') }}

      - name: Live Candle infer (real safetensors)
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --features laya-live \
            --lib \
            live_laya_infer \
            -- --exact --nocapture
