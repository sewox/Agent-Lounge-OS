# TEMPORARY — prove nats_manager ephemeral ports-file path has no free→rebind race.
# Runs the nats_manager suite 20× on ubuntu/macOS/Windows with --test-threads=16.
# Remove after 20/20 evidence on all three OSes.

name: TMP nats ports-file stress

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tmp-nats-ports-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nats-stress:
    name: NATS 20x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        timeout-minutes: 26
        run: bash scripts/ci/install-linux-build-deps.sh --preset tauri-gtk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage externalBin stub
        shell: bash
        run: bash src-tauri/scripts/prepare-sidecar.sh --stub

      - name: Install nats-server
        shell: bash
        run: bash scripts/ci/install-nats-server.sh

      - name: nats_manager ×20 (--test-threads=16)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "=== ${{ matrix.os }} run $i/20 ==="
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features test-helpers \
              --lib services::nats_manager:: -- --test-threads=16
          done
          echo "OK ${{ matrix.os }} 20/20"
