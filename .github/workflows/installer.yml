# Installer smoke tests (PR-Install-1). Non-required check name — does not
# rename or replace any of the 16 branch-protection required checks.
# Distro matrix runs via docker on ubuntu-latest (checkout stays on the host so
# images without tar/git still work). Never assumes apt.

name: Installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-distros:
    name: Installer Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # e2fsprogs: chattr +i for root-proof undeletable-path uninstall tests.
          - distro: debian
            image: debian:bookworm-slim
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates curl coreutils findutils e2fsprogs
          - distro: ubuntu
            image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates curl coreutils findutils e2fsprogs
          - distro: fedora
            image: fedora:41
            setup: dnf install -y bash ca-certificates curl findutils e2fsprogs
          - distro: opensuse
            image: opensuse/leap:15.6
            # CDN update-repo timeouts → zypper exit 106; see scripts/install/setup-opensuse-ci.sh
            setup: bash scripts/install/setup-opensuse-ci.sh
          - distro: arch
            image: archlinux:latest
            setup: pacman -Sy --noconfirm bash curl findutils tar gzip e2fsprogs
          - distro: alpine
            image: alpine:3.20
            setup: apk add --no-cache bash curl coreutils findutils tar gzip
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests in ${{ matrix.distro }}
        run: |
          set -euo pipefail
          chmod +x install.sh scripts/install/*.sh
          WT="${RUNNER_TEMP}/lounge-${{ matrix.distro }}"
          mkdir -p "$WT"
          # LINUX_IMMUTABLE: allow chattr +i inside the container (not in Docker's default cap set).
          docker run --rm \
            --cap-add=LINUX_IMMUTABLE \
            -v "$PWD:/src:ro" \
            -v "$WT:/work" \
            -w /work \
            "${{ matrix.image }}" \
            sh -c 'set -eu
              export TMPDIR=/work/tmp
              export LOUNGE_FIXTURE_DIR=/work/fixture
              export LOUNGE_TEST_PREFIX=/work/prefix
              mkdir -p "$TMPDIR" "$LOUNGE_FIXTURE_DIR" "$LOUNGE_TEST_PREFIX"
              cp -a /src/. /work/src
              cd /work/src
              chmod +x install.sh scripts/install/*.sh scripts/ci/*.sh
              # Setup after copy so openSUSE can run scripts/install/setup-opensuse-ci.sh
              ${{ matrix.setup }}
              bash scripts/install/test-install-unix.sh'

      # Host Ubuntu smoke once per matrix row would be wasteful — only ubuntu row.
      - name: Install Rust toolchain
        if: matrix.distro == 'ubuntu'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        if: matrix.distro == 'ubuntu'
        with:
          workspaces: src-tauri
          prefix-key: connect-cli-smoke-installer

      - name: Install Linux Tauri build deps
        if: matrix.distro == 'ubuntu'
        timeout-minutes: 26
        run: bash scripts/ci/install-linux-build-deps.sh --preset tauri-gtk

      - name: Connect CLI smoke (temp HOME)
        if: matrix.distro == 'ubuntu'
        run: |
          set -euo pipefail
          chmod +x scripts/ci/connect-cli-smoke.sh
          bash scripts/ci/connect-cli-smoke.sh

  macos:
    name: Installer macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests
        run: |
          set -euo pipefail
          chmod +x install.sh scripts/install/*.sh
          bash scripts/install/test-install-unix.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: connect-cli-smoke-installer

      - name: Connect CLI smoke (temp HOME)
        run: |
          set -euo pipefail
          chmod +x scripts/ci/connect-cli-smoke.sh
          bash scripts/ci/connect-cli-smoke.sh

  windows:
    name: Installer Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\scripts\install\test-install-windows.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: connect-cli-smoke-installer

      - name: Connect CLI smoke (temp HOME)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/connect-cli-smoke.sh
          bash scripts/ci/connect-cli-smoke.sh
