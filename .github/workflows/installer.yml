# Installer smoke tests (PR-Install-1). Non-required check name — does not
# rename or replace any of the 16 branch-protection required checks.
# Distro matrix runs via docker on ubuntu-latest (checkout stays on the host so
# images without tar/git still work). Never assumes apt.

name: Installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-distros:
    name: Installer Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:bookworm-slim
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates curl coreutils findutils
          - distro: ubuntu
            image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates curl coreutils findutils
          - distro: fedora
            image: fedora:41
            setup: dnf install -y bash ca-certificates curl findutils
          - distro: opensuse
            image: opensuse/leap:15.6
            setup: zypper --non-interactive install -y bash curl findutils gzip tar
          - distro: arch
            image: archlinux:latest
            setup: pacman -Sy --noconfirm bash curl findutils tar gzip
          - distro: alpine
            image: alpine:3.20
            setup: apk add --no-cache bash curl coreutils findutils tar gzip
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests in ${{ matrix.distro }}
        run: |
          set -euo pipefail
          chmod +x install.sh scripts/install/*.sh
          WT="${RUNNER_TEMP}/lounge-${{ matrix.distro }}"
          mkdir -p "$WT"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$WT:/work" \
            -w /work \
            "${{ matrix.image }}" \
            sh -c 'set -eu
              ${{ matrix.setup }}
              export TMPDIR=/work/tmp
              export LOUNGE_FIXTURE_DIR=/work/fixture
              export LOUNGE_TEST_PREFIX=/work/prefix
              mkdir -p "$TMPDIR" "$LOUNGE_FIXTURE_DIR" "$LOUNGE_TEST_PREFIX"
              cp -a /src/. /work/src
              cd /work/src
              chmod +x install.sh scripts/install/*.sh
              bash scripts/install/test-install-unix.sh'

  macos:
    name: Installer macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests
        run: |
          set -euo pipefail
          chmod +x install.sh scripts/install/*.sh
          bash scripts/install/test-install-unix.sh

  windows:
    name: Installer Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run installer fixture tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\scripts\install\test-install-windows.ps1
