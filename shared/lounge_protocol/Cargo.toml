[package]
name = "lounge_protocol"
version = "0.1.0"
edition = "2021"
description = "Agent Lounge OS paylaşılan bus zarfı ve NATS subject kataloğu"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jsonschema = { version = "0.28", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
