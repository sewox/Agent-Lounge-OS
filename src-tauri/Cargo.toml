[package]
name = "agent-lounge-os"
version = "0.1.0"
description = "Yerel ajan orkestrasyon katmanı — Lounge Kernel"
edition = "2021"
rust-version = "1.77.2"
default-run = "agent-lounge-os"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lounge-mcp"
path = "src/bin/lounge_mcp.rs"

[[bin]]
name = "lounge-test-helper"
path = "src/bin/lounge_test_helper.rs"
required-features = ["test-helpers"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "=2.10.0"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-notification = "=2.5.0"
tokio = { version = "1.53.1", features = ["full"] }
nats = "0.26.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
sysinfo = "0.39"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
lounge_protocol = { path = "../shared/lounge_protocol" }
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.4"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
sha2 = "0.11"
bcrypt = "0.17"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.11.0", default-features = false, features = ["metal"] }
candle-nn = { version = "0.11.0", default-features = false, features = ["metal"] }

[features]
default = []
# Real Hugging Face Laya weights inference (nightly). Not enabled in PR CI.
laya-live = []
# Test-only Graph UI ownership helpers + lounge-test-helper bin.
# Required for `tests/graph_ui_port_ownership.rs`. Never enable for release/tauri builds.
test-helpers = []
